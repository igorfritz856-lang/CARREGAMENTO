services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carregamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/carregamento
    depends_on:
      - db
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  postgres_data:
